<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="face-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd5b8" />
      <stop offset="100%" stop-color="#f6b896" />
    </linearGradient>
    <linearGradient id="hair-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="hoodie-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient background glow ring -->
  <circle cx="200" cy="200" r="185" fill="none" stroke="url(#bg-grad)" stroke-width="4" stroke-dasharray="8 6" opacity="0.6" />
  <circle cx="200" cy="200" r="170" fill="#0f172a" opacity="0.9" />

  <!-- Code brackets aura in background -->
  <text x="50" y="150" fill="#6366f1" font-family="'JetBrains Mono', monospace" font-size="28" font-weight="bold" opacity="0.3">&lt;/&gt;</text>
  <text x="320" y="240" fill="#06b6d4" font-family="'JetBrains Mono', monospace" font-size="24" font-weight="bold" opacity="0.3">{ ; }</text>
  <text x="70" y="270" fill="#a855f7" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="bold" opacity="0.3">9.7</text>

  <!-- Developer Hair Back -->
  <path d="M125 150 C125 70, 275 70, 275 150 C285 220, 280 260, 260 270 C245 230, 255 170, 250 150 C230 110, 170 110, 150 150 C145 170, 155 230, 140 270 C120 260, 115 220, 125 150 Z" fill="url(#hair-grad)" />

  <!-- Shoulders & Hoodie -->
  <path d="M110 370 C110 295, 150 280, 200 280 C250 280, 290 295, 290 370 Z" fill="url(#hoodie-grad)" />
  <path d="M165 285 C175 320, 225 320, 235 285 Z" fill="#1e1b4b" />
  <path d="M175 280 C180 300, 220 300, 225 280 Z" fill="url(#face-grad)" />

  <!-- Hoodie Strings & Accent -->
  <line x1="185" y1="300" x2="185" y2="340" stroke="#a5b4fc" stroke-width="3" stroke-linecap="round" />
  <line x1="215" y1="300" x2="215" y2="340" stroke="#a5b4fc" stroke-width="3" stroke-linecap="round" />

  <!-- Neck -->
  <rect x="182" y="240" width="36" height="45" rx="8" fill="url(#face-grad)" />

  <!-- Face -->
  <ellipse cx="200" cy="195" rx="56" ry="64" fill="url(#face-grad)" />

  <!-- Hair Front / Bangs -->
  <path d="M142 165 C150 110, 250 110, 258 165 C240 135, 215 138, 200 148 C185 138, 160 135, 142 165 Z" fill="url(#hair-grad)" />

  <!-- Glasses (Smart Developer aesthetic) -->
  <rect x="160" y="180" width="32" height="24" rx="8" fill="none" stroke="#38bdf8" stroke-width="3.5" filter="url(#glow)" />
  <rect x="208" y="180" width="32" height="24" rx="8" fill="none" stroke="#38bdf8" stroke-width="3.5" filter="url(#glow)" />
  <line x1="192" y1="192" x2="208" y2="192" stroke="#38bdf8" stroke-width="3.5" />
  <line x1="148" y1="188" x2="160" y2="188" stroke="#38bdf8" stroke-width="3" />
  <line x1="240" y1="188" x2="252" y2="188" stroke="#38bdf8" stroke-width="3" />

  <!-- Eyes behind glasses -->
  <circle cx="176" cy="192" r="3.5" fill="#1e1b4b" />
  <circle cx="224" cy="192" r="3.5" fill="#1e1b4b" />
  <circle cx="177.5" cy="190.5" r="1.2" fill="#ffffff" />
  <circle cx="225.5" cy="190.5" r="1.2" fill="#ffffff" />

  <!-- Smile -->
  <path d="M190 226 Q200 236 210 226" fill="none" stroke="#b45309" stroke-width="2.5" stroke-linecap="round" />

  <!-- Sleek Headset / Headphones -->
  <path d="M140 185 C132 185, 132 215, 140 215 Z" fill="#6366f1" />
  <path d="M260 185 C268 185, 268 215, 260 215 Z" fill="#6366f1" />
  <path d="M140 185 C140 115, 260 115, 260 185" fill="none" stroke="#6366f1" stroke-width="4.5" stroke-linecap="round" />

  <!-- Floating Tech Sparkles -->
  <circle cx="295" cy="140" r="4" fill="#38bdf8" />
  <polygon points="105,185 108,193 116,195 108,198 105,205 102,198 94,195 102,193" fill="#f43f5e" />
  <polygon points="305,280 307,285 312,287 307,289 305,294 303,289 298,287 303,285" fill="#eab308" />
</svg>
